<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RA2 Ladder</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="./js/core.js"></script>
</head>
<body>
  <h1>RA2 Ladder</h1>
  <div class="topnav">
    <a class="btn" href="./index.html">Ladder</a>
    <a class="btn" href="./hof.html">Hall of Fame</a>
    <a class="btn" href="./admin.html">Admin</a>
  </div>

  <div class="sub" id="meta">Loading…</div>
  <div id="errorBox" class="err" style="display:none;"></div>

  <input id="q" placeholder="Search by username, user_id, or class (e.g. S, A+)" />

  <div class="section">
    <div class="muted">Top 10 Rating (live)</div>
    <canvas id="chartTop10" height="220"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th><th>User</th><th>Class</th><th>Rating</th><th>W</th><th>L</th>
        <th>Games</th><th>Win Streak</th><th>Loss Streak</th><th>Dodges</th><th>Last Match</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script type="module">
    import { loadLeaderboard, renderLeaderboardPage } from "./js/core.js";
    renderLeaderboardPage({
      leaderboardPath: "./leaderboard.json",
      onTick: loadLeaderboard
    });
  </script>
</body>
</html>
